name: check loupe

on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: loupe

permissions:
  contents: read

jobs:
  check:
    name: compare with Fedora
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.compare.outputs.builds }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: compare COPR and Fedora builds
        id: compare
        run: python3 .github/scripts/outdated-loupe.py >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.chroot }}
    needs: check
    if: needs.check.outputs.builds != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.check.outputs.builds) }}
    uses: ./.github/workflows/build-loupe.yml
    with:
      chroot: ${{ matrix.chroot }}
      commit: ${{ matrix.commit }}
    secrets: inherit
